const $=x=>document.getElementById(x),svg=$('canvas'),drawing=$('drawing');const NS='http://www.w3.org/2000/svg';const colors={ethernet:'#17b77f',rs485:'#eea43f',rs232:'#8664eb',power:'#de5c5c',dry:'#4a92e1'};

const fresh=()=>({schema:'room-designer/v0.3',id:uid(),name:'نقشه جدید',date:new Date().toISOString().slice(0,10),devices:[],cables:[]});let doc=fresh(),selection=null,tool='select',start=null,history=[],drag=null,view={x:0,y:0,w:960,h:680},profiles=JSON.parse(safeStorage.getItem('rd_profiles')||'{}');function uid(){return 'x'+Math.random().toString(36).slice(2,10)}function saveAuto(){safeStorage.setItem('rd_last',JSON.stringify(doc));$('title').textContent=doc.name+' · '+doc.date}function checkpoint(){history.push(JSON.stringify(doc));if(history.length>60)history.shift()}function notify(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}function clean(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function file(s,name,mime='application/json'){const blob=new Blob([s],{type:mime}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}function device(id){return doc.devices.find(d=>d.id===id)}function portInfo(d,pid){const n=d.ports.findIndex(p=>p.id===pid);if(n<0)return null;const p=d.ports[n],same=d.ports.filter(q=>q.side===p.side),idx=same.indexOf(p),w=d.w||108,h=d.h||70;let x=d.x,y=d.y;if(p.side==='left'){x-=w/2;y+=(idx-(same.length-1)/2)*16}else if(p.side==='right'){x+=w/2;y+=(idx-(same.length-1)/2)*16}else if(p.side==='top'){y-=h/2;x+=(idx-(same.length-1)/2)*16}else{y+=h/2;x+=(idx-(same.length-1)/2)*16}return {x,y,p}}

function addDevice(i){const t=catalog[i];if(!t)return;checkpoint();let n=doc.devices.length;const d={id:uid(),kind:t.kind||'custom',name:t.name,x:170+(n%4)*175,y:145+(Math.floor(n/4)%4)*115,w:120,h:65,ports:t.ports.map(p=>({...p,id:uid()}))};doc.devices.push(d);selection={id:d.id,kind:'device'};close();setTool('select');render();notify('تجهیز افزوده شد؛ با انگشت جابه‌جایش کن')}function addMenu(){sheet('افزودن تجهیز',`<p class="muted">یک تجهیز انتخاب کن. هر مربع رنگی یک پورت اتصال است.</p><div class="grid">${catalog.map((t,i)=>`<button class="tile" data-add="${i}"><b>${clean(t.name)}</b><small>${t.ports.length} پورت · ${clean(t.kind)}</small></button>`).join('')}</div><div class="divider"></div><button data-act="createDevice">＋ تعریف تجهیز جدید</button>`)}function propertyMenu(){if(!selection){sheet('ویژگی‌ها','<p class="muted">ابتدا یک تجهیز یا کابل را روی نقشه انتخاب کن.</p>');return}if(selection.kind==='cable'){const c=doc.cables.find(c=>c.id===selection.id);if(!c)return;sheet('ویژگی کابل',`<div class="banner">${clean(device(c.a.dev)?.name)} ↔ ${clean(device(c.b.dev)?.name)}</div><label>نوع ارتباط</label><select id="cType">${Object.entries(types).map(([k,v])=>`<option value="${clean(k)}" ${c.type===k?'selected':''}>${clean(v.name)}</option>`).join('')}</select><div class="checkbox"><input type="checkbox" id="cReserve" ${c.reserve?'checked':''}> رزرو / برنامه‌ریزی‌شده</div><div class="row"><button class="primary" data-act="saveCable">ثبت</button><button class="danger" data-act="deleteSelected">حذف</button></div>`);return}const d=device(selection.id);if(!d)return;sheet('ویژگی تجهیز',`<label>نام تجهیز روی نقشه</label><input id="dName" value="${clean(d.name)}"><div class="grid"><div><label>عرض (واحد نقشه)</label><input type="number" id="dWidth" value="${d.w}"></div><div><label>ارتفاع</label><input type="number" id="dHeight" value="${d.h}"></div></div><h3>پورت‌ها</h3>${d.ports.map(p=>`<div class="tile" style="margin:5px 0"><span class="chip" style="color:${types[p.type function menu(){sheet('منوی Room Designer',`<div class="grid"><button class="tile" data-act="new"><b>＋ نقشه جدید</b><small>New</small></button><button class="tile" data-act="projects"><b>▣ نقشه‌های ذخیره‌شده</b><small>Local Projects</small></button><button class="tile" data-act="saveLocal"><b>▤ ذخیره نقشه</b><small>Save on this device</small></button><button class="tile" data-act="exportJson"><b>⇩ دریافت فایل نقشه</b><small>JSON</small></button><button class="tile" data-act="import"><b>⇧ بازکردن فایل</b><small>Open</small></button><button class="tile" data-act="print"><b>▧ خروجی PDF</b><small>Print / Save PDF</small></button><button class="tile" data-act="dxf"><b>⌁ خروجی DXF</b><small>Basic lines</small></button><button class="tile" data-act="report"><b>≡ گزارش ارتباطات</b><small>Connections</small></button><button class="tile" data-act="types"><b>◈ انواع ارتباطات</b><small>Interfaces</small></button><button class="tile" data-act="createDevice"><b>⚙ تعریف تجهیز</b><small>Component</small></button><button class="tile" data-act="projectInfo"><b>▧ مشخصات نقشه</b><small>Title block</small></button></div><p class="muted">این نسخه استاتیک است؛ برای کار با فایل‌ها نیازی به سرور نیست.</p>`)}function info(){sheet('مشخصات نقشه',`<label>نام پروژه / عنوان نقشه</label><input id="projName" value="${clean(doc.name)}"><label>تاریخ نقشه</label><input type="date" id="projDate" value="${doc.date}"><button class="primary" data-act="saveInfo" style="margin-top:13px">ثبت مشخصات</button>`)}function saveLocal(){profiles[doc.id]=JSON.parse(JSON.stringify(doc));safeStorage.setItem('rd_profiles',JSON.stringify(profiles));notify('نقشه در این مرورگر ذخیره شد')}function projectsMenu(){sheet('نقشه‌های محلی',`<p class="muted">نقشه‌های این مرورگر و دستگاه؛ با پاک‌شدن داده مرورگر ممکن است حذف شوند. برای پشتیبان‌گیری فایل JSON بگیر.</p>${Object.values(profiles).map(d=>`<button class="tile" style="width:100%;margin:5px 0" data-open="${clean(d.id)}"><b>${clean(d.name)}</b><small>${clean(d.date)} · ${d.devices?.length||0} تجهیز</small></button>`).join('')||'<p>هنوز نقشه‌ای ذخیره نشده.</p>'}`)}function reportHTML(){return `<table style="width:100%;border-collapse:collapse;font-size:12px" border="1" cellpadding="8"><thead><tr><th>مبدأ / پورت</th><th>مقصد / پورت</th><th>نوع</th><th>وضعیت</th></tr></thead><tbody>${doc.cables.map(c=>{let a=device(c.a.dev),b=device(c.b.dev);return `<tr><td>${clean(a?.name)} / ${clean(a?.ports.find(x=>x.id===c.a.port)?.name)}</td><td>${clean(b?.name)} / ${clean(b?.ports.find(x=>x.id===c.b.port)?.name)}</td><td>${clean(types[c.type]?.name||c.type)}</td><td>${c.reserve?'رزرو':'متصل'}</td></tr>`}).join('')||'<tr><td colspan="4">هنوز کابلی رسم نشده</td></tr>'}</tbody></table>`}function report(){sheet('گزارش ارتباطات',reportHTML())}
function printMenu(){sheet('خروجی PDF / چاپ',`<div class="checkbox"><input id="pdfTitle" type="checkbox" checked> درج عنوان پروژه و تاریخ</div><div class="checkbox"><input id="pdfReport" type="checkbox" checked> درج جدول ارتباطات زیر نقشه</div><p class="muted">در پنجره چاپ مرورگر، گزینه Save as PDF را انتخاب کن. در iOS از گزینه Print و سپس Share / Save to Files استفاده کن.</p><button class="primary" data-act="doPrint">آماده‌سازی خروجی</button>`)}function downloadDXF(){let s='0\nSECTION\n2\nHEADER\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n';function line(a,b,layer){s+=`0\nLINE\n8\n${layer}\n10\n${a.x}\n20\n${-a.y}\n30\n0\n11\n${b.x}\n21\n${-b.y}\n31\n0\n`}for(const d of doc.devices){const a={x:d.x-d.w/2,y:d.y-d.h/2},b={x:d.x+d.w/2,y:d.y+d.h/2};line(a,{x:b.x,y:a.y},'DEVICE');line({x:b.x,y:a.y},b,'DEVICE');line(b,{x:a.x,y:b.y},'DEVICE');line({x:a.x,y:b.y},a,'DEVICE')}for(const c of doc.cables){const da=device(c.a.dev),db=device(c.b.dev),a=da&&portInfo(da,c.a.port),b=db&&portInfo(db,c.b.port);if(a&&b){const pts=[a,...(c.waypoints||[]),b];for(let i=1;i<pts.length;i++)line(pts[i-1],pts[i],`CABLE_${c.type.replace(/[^a-zA-Z0-9_]/g,'_')}`)}}s+='0\nENDSEC\n0\nEOF\n';file(s,(doc.name||'room')+'.dxf','application/dxf');notify('DXF ساده خروجی گرفته شد؛ متادیتای پورت‌ها در آن حفظ نمی‌شود')}
function printNow(){const title=$('pdfTitle').checked,withReport=$('pdfReport').checked;let clone=svg.cloneNode(true);clone.setAttribute('width','960');clone.setAttribute('height','680');clone.setAttribute('viewBox','0 0 960 680');const html=`<!doctype html><html dir="rtl"><meta charset="utf-8"><title>${clean(doc.name)}</title><style>body{font-family:Tahoma,Arial;padding:20px;color:#192638}svg{max-width:100%;height:auto;background:#e8edf0}h2{font-size:20px}table{border-collapse:collapse;width:100%;font-size:11px}td,th{border:1px solid #aaa;padding:6px}@page{size:A4 landscape;margin:12mm}</style>${title?`<h2>${clean(doc.name)} <small>· ${clean(doc.date)}</small></h2>`:''}${clone.outerHTML}${withReport?`<h3>گزارش ارتباطات</h3>${reportHTML()}`:''}<p style="font-size:10px">Room Designer · Powered by NSP</p><script>window.onload=()=>setTimeout(()=>window.print(),450)<\/script></html>`;const b=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(b);const w=window.open(url,'_blank');if(!w){file(html,'room-print.html','text/html');notify('مرورگر پنجره چاپ را مسدود کرد؛ فایل چاپ دریافت شد')}close()}
$('overlay').onclick=close;$('closeSheet').onclick=close;$('menuBtn').onclick=menu;$('addBtn').onclick=addMenu;$('propsBtn').onclick=propertyMenu;$('selectTool').onclick=()=>setTool('select');$('cableBtn').onclick=()=>setTool('cable');$('panBtn').onclick=()=>setTool('pan');$('undoBtn').onclick=()=>{if(history.length){doc=JSON.parse(history.pop());selection=null;render();notify('بازگشت انجام شد')}};$('zoomBtn').onclick=()=>{view={x:0,y:0,w:960,h:680};render()};
$('sheetContent').addEventListener('click',e=>{const b=e.target.closest('[data-add],[data-act],[data-open]');if(!b)return;if(b.dataset.add!=null){addDevice(+b.dataset.add);return}if(b.dataset.open){doc=JSON.parse(JSON.stringify(profiles[b.dataset.open]));selection=null;history=[];close();render();return}const a=b.dataset.act;switch(a){case 'new':if(!confirm('نقشه جدید ایجاد شود؟ برای نگهداری نقشه فعلی، ابتدا آن را ذخیره کن.'))return;doc=fresh();history=[];selection=null;close();render();break;case 'saveLocal':saveLocal();close();break;case 'projects':projectsMenu();break;case 'projectInfo':info();break;case 'saveInfo':checkpoint();doc.name=$('projName').value.trim()||'بدون نام';doc.date=$('projDate').value||doc.date;close();render();break;case 'types':typesMenu();break;case 'createDevice':deviceEditor();break;case 'saveCatalog':{const name=$('newName').value.trim(),pn=$('newPortName').value.trim();if(!name||!pn){notify('نام تجهیز و پورت ضروری است');return}catalog.push({name,kind:'custom',ports:[{name:pn,type:$('newPortType').value,side:$('newSide').value}]});safeStorage.setItem('rd_catalog',JSON.stringify(catalog));close();notify('تجهیز در کتابخانه ذخیره شد');break}case 'saveType':{const id=$('typeId').value.trim().toLowerCase(),name=$('typeName').value.trim();if(!/^[a-z0-9_-]+$/.test(id)||!name){notify('شناسه انگلیسی و نام معتبر وارد کن');return}types[id]={name,color:$('typeColor').value};safeStorage.setItem('rd_types',JSON.stringify(types));typesMenu();notify('نوع ارتباط افزوده شد');break}case 'exportJson':file(JSON.stringify({doc,types,catalog},null,2),(doc.name||'room')+'.roomplan');close();break;case 'import':$('fileInput').click();break;case 'report':report();break;case 'print':printMenu();break;case 'doPrint':printNow();break;case 'dxf':downloadDXF();close();break;case 'saveDevice':{const d=device(selection?.id);if(!d)return;checkpoint();d.name=$('dName').value||d.name;d.w=Math.max(50,+$('dWidth').value||120);d.h=Math.max(35,+$('dHeight').value||65);close();render();break}case 'saveCable':{let c=doc.cables.find(c=>c.id===selection?.id);if(!c)return;checkpoint();c.type=$('cType').value;c.reserve=$('cReserve').checked;close();render();break}case 'deleteSelected':checkpoint();if(selection?.kind==='device'){doc.devices=doc.devices.filter(d=>d.id!==selection.id);doc.cables=doc.cables.filter(c=>c.a.dev!==selection.id&&c.b.dev!==selection.id)}else doc.cables=doc.cables.filter(c=>c.id!==selection?.id);selection=null;close();render();break;}});
$('fileInput').addEventListener('change',async e=>{try{const t=await e.target.files[0].text(),x=JSON.parse(t),d=x.doc||x;if(!Array.isArray(d.devices)||!Array.isArray(d.cables))throw Error('ساختار نامعتبر');doc=d;if(x.types){types={...defaults,...x.types};safeStorage.setItem('rd_types',JSON.stringify(types))}if(x.catalog){catalog=x.catalog;safeStorage.setItem('rd_catalog',JSON.stringify(catalog))}history=[];selection=null;close();render();notify('نقشه باز شد')}catch(err){notify('خطا در بازکردن فایل: '+err.message)}e.target.value=''});
try{const last=JSON.parse(safeStorage.getItem('rd_last'));if(last&&Array.isArray(last.devices))doc=last}catch{}render();
})();</script></body></html>
