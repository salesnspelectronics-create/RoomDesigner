  switch(act.dataset.deskAct){case 'select':setTool('select');break;case 'create':deviceEditor();break;case 'properties':propertyMenu();break;case 'group':groupAllSelected();break;case 'ungroup':ungroupSelected();break;case 'finishPolyline':if(tool==='wall'&&archMode==='polyline')setTool('select');break}
 });
 document.addEventListener('change',e=>{
  const input=e.target.closest('[data-desk-prop]');if(!input||input.readOnly||input.disabled)return;
  const key=input.dataset.deskProp,d=selection?.kind==='device'?device(selection.id):null,c=selection?.kind==='cable'?doc.cables.find(c=>c.id===selection.id):null;
  if(d&&!d.locked){let value=input.value;if(['x','y','w','h','rotation'].includes(key)){if(value.trim()===''||!Number.isFinite(Number(value))){$('deskProperties').dataset.signature='';updateDesktopProperties();return}value=Number(value);if(key==='w')value=Math.max(50,value);if(key==='h')value=Math.max(35,value);if(key==='rotation'){if(d.ports.length)return;value=(value%360+360)%360}}else if(key==='backgroundColor'){if(!/^#[0-9a-f]{6}$/i.test(value))return}else if(key!=='name')return;
   if(d[key]===value)return;checkpoint();d[key]=value;render();$('deskProp-'+key)?.focus();
  }else if(c){let value=input.type==='checkbox'?input.checked:input.value;if(key==='width'){if(!value.trim()||!Number.isFinite(Number(value)))return;value=Math.max(1,Math.min(24,Number(value)))}else if(key==='name')value=value.trim()||'کابل';else if(key==='lineStyle'){if(!['solid','dashed'].includes(value))return}else if(key!=='reserve')return;
   if(c[key]===value)return;checkpoint();c[key]=value;render();$('deskProp-'+key)?.focus();
  }
 });
 // The existing sheet can add/import a catalog; refresh cards after that dispatcher finishes.
 populateDesktopToolbox();window.addEventListener('resize',setDesktopLayout);setDesktopLayout();
}

document.addEventListener('click',e=>{const b=e.target.closest('[data-history-index]');if(!b)return;const index=Number(b.dataset.historyIndex);if(!Number.isInteger(index)||index<0||index>=history.length)return;if(!confirm('به وضعیت این مرحله برگردیم؟ وضعیت فعلی در Undo ذخیره خواهد شد.'))return;let restored;try{restored=validateRoomDocument(JSON.parse(history[index]))}catch(err){notify('بازگردانی نامعتبر است: '+err.message);return}checkpoint();doc=restored;selection=null;multiSelection=null;clearPointerState();scheduleSave();close();render();notify('نقشه به وضعیت انتخابی بازگشت')});
