reak;case 'backGroups':addMenu();break;case 'types':typesMenu();break;case 'createDevice':deviceEditor();break;case 'saveCatalog':{const name=$('newName').value.trim(),pn=$('newPortName').value.trim();if(!name||!pn){notify('نام تجهیز و پورت ضروری است');return}catalog.push({name,kind:'custom',ports:[{name:pn,type:$('newPortType').value,side:document.querySelector('input[name="newSide"]:checked')?.value||'left'}]});safeStorage.setItem('rd_catalog',JSON.stringify(catalog));close();notify('تجهیز در کتابخانه ذخیره شد');break}case 'saveType':{const id=$('typeId').value.trim().toLowerCase(),name=$('typeName').value.trim();if(!/^[a-z0-9_-]+$/.test(id)||!name){notify('شناسه انگلیسی و نام معتبر وارد کن');return}types[id]={name,color:$('typeColor').value};safeStorage.setItem('rd_types',JSON.stringify(types));typesMenu();notify('نوع ارتباط افزوده شد');break}case 'exportJson':file(JSON.stringify({doc,types,catalog},null,2),(doc.name||'room')+'.roomplan');close();break;case 'import':$('fileInput').click();break;case 'report':report();break;case 'print':printMenu();break;case 'doPrint':printNow();break;case 'dxf':downloadDXF();close();break;case 'saveDevice':{const d=device(selection?.id);if(!d)return;checkpoint();d.name=$('dName').value||d.name;d.w=Math.max(50,+$('dWidth').value||120);d.h=Math.max(35,+$('dHeight').value||65);for(const x of $('sheetContent').querySelectorAll('[data-port-side]:checked')){const p=d.ports.find(p=>p.id===x.dataset.portSide);if(p)p.side=x.value}close();render();break}case 'duplicateSelected':duplicateSelected();break;case 'saveCable':{let c=doc.cables.find(c=>c.id===selection?.id);if(!c)return;checkpoint();c.name=($('cName').value||'کابل').trim()||'کابل';c.type=$('cType').value;c.reserve=$('cReserve').checked;close();render();break}case 'deleteSelected':checkpoint();if(selection?.kind==='device'){doc.devices=doc.devices.filter(d=>d.id!==selection.id);doc.cables=doc.cables.filter(c=>c.a.dev!==selection.id&&c.b.dev!==selection.id)}else doc.cables=doc.cables.filter(c=>c.id!==selection?.id);selection=null;close();render();break;}});
$('fileInput').addEventListener('change',async e=>{try{const t=await e.target.files[0].text(),x=JSON.parse(t),d=x.doc||x;if(!Array.isArray(d.devices)||!Array.isArray(d.cables))throw Error('ساختار نامعتبر');doc=d;if(x.types){types={...defaults,...x.types};safeStorage.setItem('rd_types',JSON.stringify(types))}if(x.catalog){catalog=x.catalog;safeStorage.setItem('rd_catalog',JSON.stringify(catalog))}history=[];selection=null;close();render();notify('نقشه باز شد')}catch(err){notify('خطا در بازکردن فایل: '+err.message)}e.target.value=''});
try{const last=JSON.parse(safeStorage.getItem('rd_last'));if(last&&Array.isArray(last.devices))doc=last}catch{}render();if(!activeUser)setTimeout(()=>userPicker(),100);
