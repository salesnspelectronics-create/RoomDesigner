function propertyMenu(){if(!selection){sheet('ویژگی‌ها','<p class="muted">ابتدا یک تجهیز یا کابل را روی نقشه انتخاب کن.</p>');return}if(selection.kind==='cable'){const c=doc.cables.find(c=>c.id===selection.id);if(!c)return;sheet('ویژگی کابل',`<div class="banner">${clean(device(c.a.dev)?.name)} ↔ ${clean(device(c.b.dev)?.name)}</div><label>نوع ارتباط</label><select id="cType">${Object.entries(types).map(([k,v])=>`<option value="${clean(k)}" ${c.type===k?'selected':''}>${clean(v.name)}</option>`).join('')}</select><div class="checkbox"><input type="checkbox" id="cReserve" ${c.reserve?'checked':''}> رزرو / برنامه‌ریزی‌شده</div><div class="row"><button class="primary" data-act="saveCable">ثبت</button><button class="danger" data-act="deleteSelected">حذف</button></div>`);return}const d=device(selection.id);if(!d)return;sheet('ویژگی تجهیز',`<label>نام تجهیز روی نقشه</label><input id="dName" value="${clean(d.name)}"><div class="grid"><div><label>عرض (واحد نقشه)</label><input type="number" id="dWidth" value="${d.w}"></div><div><label>ارتفاع</label><input type="number" id="dHeight" value="${d.h}"></div></div><h3>محل پورت‌ها</h3>${d.ports.map(p=>`<div class="tile" style="margin:6px 0"><b style="color:${types[p.type]?.color||'#ddd'}">■ ${clean(p.name)} — ${clean(types[p.type]?.name||p.type)}</b><label>جهت نمایش</label><select data-port-side="${clean(p.id)}">${[['left','چپ'],['right','راست'],['top','بالا'],['bottom','پایین']].map(([v,n])=>`<option value="${v}" ${p.side===v?'selected':''}>${n}</option>`).join('')}</select></div>`).join('')}<div class="row"><button class="primary" data-act="saveDevice">ثبت تغییرات</button><button class="danger" data-act="deleteSelected">حذف</button></div>`)}
function deviceEditor(){sheet('تعریف تجهیز جدید',`<label>نام تجهیز</label><input id="newName" placeholder="مثلاً کنترلر RS-485"><label>نام پورت</label><input id="newPortName" value="BUS-01"><label>نوع ارتباط پورت</label><select id="newPortType">${Object.entries(types).map(([k,v])=>`<option value="${clean(k)}">${clean(v.name)}</option>`).join('')}</select><label>محل قرارگیری مربع پورت</label><select id="newSide"><option value="left">چپ</option><option value="right">راست</option><option value="top">بالا</option><option value="bottom">پایین</option></select><p class="muted">در این نمونه هر بار یک تجهیز با پورت اولیه ایجاد می‌شود. افزودن چند پورت و جابه‌جایی گرافیکی پورت در ویرایشگر نهایی تکمیل می‌شود.</p><button class="primary" data-act="saveCatalog">ثبت در کتابخانه تجهیزات</button>`)}function typesMenu(){sheet('انواع ارتباطات',`<div class="modal-scroll">${Object.entries(types).map(([k,v])=>`<div class="tile" style="margin:6px 0"><span style="color:${v.color}">■</span> ${clean(v.name)} <small>${clean(k)}</small></div>`).join('')}</div><h3>تعریف نوع جدید</h3><label>شناسه انگلیسی پایدار</label><input id="typeId" placeholder="knx"><label>عنوان نمایشی</label><input id="typeName" placeholder="KNX"><label>رنگ نمایش Port و کابل</label><input id="typeColor" type="color" value="#4bc5cb"><button class="primary" data-act="saveType" style="margin-top:12px">افزودن نوع ارتباط</button>`)}
function menu(){sheet('منوی Room Designer',`<div class="grid"><button class="tile" data-act="new"><b>＋ نقشه جدید</b><small>New</small></button><button class="tile" data-act="projects"><b>▣ نقشه‌های ذخیره‌شده</b><small>Local Projects</small></button><button class="tile" data-act="saveLocal"><b>▤ ذخیره نقشه</b><small>New Revision</small></button><button class="tile" data-act="saveCopy"><b>⧉ ذخیره کپی</b><small>Save As</small></button><button class="tile" data-act="history"><b>◷ تاریخچه</b><small>Revisions</small></button><button class="tile" data-act="userSwitch"><b>♙ تغییر کاربر</b><small>Current user</small></button><button class="tile" data-act="exportJson"><b>⇩ دریافت فایل نقشه</b><small>JSON</small></button><button class="tile" data-act="import"><b>⇧ بازکردن فایل</b><small>Open</small></button><button class="tile" data-act="print"><b>▧ خروجی PDF</b><small>Print / Save PDF</small></button><button class="tile" data-act="dxf"><b>⌁ خروجی DXF</b><small>Basic lines</small></button><button class="tile" data-act="report"><b>≡ گزارش ارتباطات</b><small>Connections</small></button><button class="tile" data-act="types"><b>◈ انواع ارتباطات</b><small>Interfaces</small></button><button class="tile" data-act="createDevice"><b>⚙ تعریف تجهیز</b><small>Component</small></button><button class="tile" data-act="projectInfo"><b>▧ مشخصات نقشه</b><small>Title block</small></button></div><p class="muted">این نسخه استاتیک است؛ برای کار با فایل‌ها نیازی به سرور نیست.</p>`)}function info(){sheet('مشخصات نقشه',`<label>نام پروژه / عنوان نقشه</label><input id="projName" value="${clean(doc.name)}"><label>تاریخ نقشه</label><input type="date" id="projDate" value="${doc.date}"><button class="primary" data-act="saveInfo" style="margin-top:13px">ثبت مشخصات</button>`)}function ensureMeta(d){if(!d.createdAt)d.createdAt=new Date().toISOString();if(!d.createdBy)d.createdBy=activeUser||'نامشخص';if(!Array.isArray(d.revisions))d.revisions=[];return d}
function userPicker(force=false){const options=users.map(u=>`<option value="${clean(u)}">${clean(u)}</option>`).join('');sheet('انتخاب کاربر · Room Designer',`<p class="muted">این نام فقط برای مرتب‌سازی و ثبت تاریخچه است؛ ورود با رمز عبور نداریم.</p><h3>کاربر جدید</h3><input id="userNew" placeholder="مثلاً علی"><button class="primary" style="margin-top:9px;width:100%" data-act="userCreate">ورود با نام جدید</button><h3>کاربر موجود</h3><select id="userExisting"><option value="">انتخاب کن</option>${options}</select><button style="margin-top:9px;width:100%" data-act="userSelect">ورود به برنامه</button>${force?'<small class="muted">می‌توانی نام فعلی را تغییر دهی.</small>':''}`)}
function activateUser(name){if(!name)return notify('نام کاربر را وارد کن');if(!users.includes(name))users.push(name);activeUser=name;safeStorage.setItem('rd_users',JSON.stringify(users));safeStorage.setItem('rd_active_user',name);close();notify('کاربر فعال: '+name)}
function snapshot(d){return {name:d.name,date:d.date,devices:JSON.parse(JSON.stringify(d.devices)),cables:JSON.parse(JSON.stringify(d.cables))}}
function diffSummary(oldD,newD){if(!oldD)return 'ایجاد نقشه';let oldA=oldD.devices||[],newA=newD.devices||[],oldC=oldD.cables||[],newC=newD.cables||[];let added=newA.filter(x=>!oldA.some(y=>y.id===x.id)).length,removed=oldA.filter(x=>!newA.some(y=>y.id===x.id)).length,changed=newA.filter(x=>{let y=oldA.find(y=>y.id===x.id);return y&&JSON.stringify(x)!==JSON.stringify(y)}).length,ca=newC.filter(x=>!oldC.some(y=>y.id===x.id)).length,cr=oldC.filter(x=>!newC.some(y=>y.id===x.id)).length;return [added&&added+' تجهیز جدید',removed&&removed+' تجهیز حذف‌شده',changed&&changed+' تجهیز ویرایش‌شده',ca&&ca+' کابل جدید',cr&&cr+' کابل حذف‌شده'].filter(Boolean).join('، ')||'ذخیره بدون تغییر هندسی'}
function saveDialog(copy=false){if(!activeUser){userPicker();return}sheet(copy?'ذخیره به‌عنوان کپی':'ذخیره نقشه',`<p class="muted">محل ذخیره: همین مرورگر. سرور اشتراکی هنوز فعال نیست.</p><label>نام نقشه</label><input id="saveName" value="${clean(doc.name)}"><label>شرح تغییرات این Revision</label><input id="saveComment" placeholder="اختیاری؛ تغییرات خودکار هم ثبت می‌شوند"><button class="primary" style="width:100%;margin-top:16px" data-act="${copy?'commitCopy':'commitSave'}">ذخیره ${copy?'کپی جدید':'Revision جدید'}</button>`)}
function saveLocal(copy=false){ensureMeta(doc);if(copy){doc=JSON.parse(JSON.stringify(doc));doc.id=uid();doc.createdAt=new Date().toISOString();doc.createdBy=activeUser;doc.revisions=[]}doc.name=($('saveName')?.value||doc.name).trim()||'نقشه بدون نام';doc.updatedAt=new Date().toISOString();const previous=doc.revisions.at(-1)?.snapshot;const snap=snapshot(doc);const revision={number:doc.revisions.length+1,at:doc.updatedAt,by:activeUser,comment:($('saveComment')?.value||'').trim(),summary:diffSummary(previous,snap),snapshot:snap};doc.revisions.push(revision);doc.revision=revision.number;doc.lastEditedBy=activeUser;profiles[doc.id]=JSON.parse(JSON.stringify(doc));safeStorage.setItem('rd_profiles',JSON.stringify(profiles));saveAuto();close();notify('Revision '+revision.number+' در این دستگاه ذخیره شد')}
function revisionMenu(){ensureMeta(doc);sheet('تاریخچه · '+clean(doc.name),`<p class="muted">Revisionها در همین فایل نقشه نگهداری می‌شوند. انتخاب نسخه قدیمی، Revision جدید می‌سازد و چیزی حذف نمی‌کند.</p>${doc.revisions.slice().reverse().map(r=>`<div class="tile" style="margin:7px 0"><b>Revision ${r.number}</b><small>${clean(r.by)} · ${clean(r.at)}</small><p>${clean(r.summary)}</p><small>${clean(r.comment)}</small><button data-restore="${r.number}">بازگردانی به‌صورت Revision جدید</button></div>`).join('')||'<p>هنوز ذخیره نسخه‌دار انجام نشده است.</p>'}`)}
function projectsMenu(){sheet('نقشه‌های این دستگاه',`<p class="muted">تمام نقشه‌های این مرورگر؛ هیچ محدودیت بر اساس نام کاربر وجود ندارد. این نقشه‌ها هنوز بین گوشی و کامپیوتر همگام نیستند.</p>${Object.values(profiles).map(d=>`<button class="tile" style="width:100%;margin:5px 0" data-open="${clean(d.id)}"><b>${clean(d.name)}</b><small>${clean(d.createdBy||'نامشخص')} · Revision ${d.revision||0} · ${clean(d.lastEditedBy||'')}</small></button>`).join('')||'<p>هنوز نقشه‌ای ذخیره نشده.</p>'}`)}
function reportHTML(){return `<table style="width:100%;border-collapse:collapse;font-size:12px" border="1" cellpadding="8"><thead><tr><th>مبدأ / پورت</th><th>مقصد / پورت</th><th>نوع</th><th>وضعیت</th></tr></thead><tbody>${doc.cables.map(c=>{let a=device(c.a.dev),b=device(c.b.dev);return `<tr><td>${clean(a?.name)} / ${clean(a?.ports.find(x=>x.id===c.a.port)?.name)}</td><td>${clean(b?.name)} / ${clean(b?.ports.find(x=>x.id===c.b.port)?.name)}</td><td>${clean(types[c.type]?.name||c.type)}</td><td>${c.reserve?'رزرو':'متصل'}</td></tr>`}).join('')||'<tr><td colspan="4">هنوز کابلی رسم نشده</td></tr>'}</tbody></table>`}function report(){sheet('گزارش ارتباطات',reportHTML())}
function printMenu(){sheet('خروجی PDF / چاپ',`<div class="checkbox"><input id="pdfTitle" type="checkbox" checked> درج عنوان پروژه و تاریخ</div><div class="checkbox"><input id="pdfReport" type="checkbox" checked> درج جدول ارتباطات زیر نقشه</div><p class="muted">در پنجره چاپ مرورگر، گزینه Save as PDF را انتخاب کن. در iOS از گزینه Print و سپس Share / Save to Files استفاده کن.</p><button class="primary" data-act="doPrint">آماده‌سازی خروجی</button>`)}function downloadDXF(){let s='0\nSECTION\n2\nHEADER\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n';function line(a,b,layer){s+=`0\nLINE\n8\n${layer}\n10\n${a.x}\n20\n${-a.y}\n30\n0\n11\n${b.x}\n21\n${-b.y}\n31\n0\n`}for(const d of doc.devices){const a={x:d.x-d.w/2,y:d.y-d.h/2},b={x:d.x+d.w/2,y:d.y+d.h/2};line(a,{x:b.x,y:a.y},'DEVICE');line({x:b.x,y:a.y},b,'DEVICE');line(b,{x:a.x,y:b.y},'DEVICE');line({x:a.x,y:b.y},a,'DEVICE')}for(const c of doc.cables){const da=device(c.a.dev),db=device(c.b.dev),a=da&&portInfo(da,c.a.port),b=db&&portInfo(db,c.b.port);if(a&&b){const pts=[a,...(c.waypoints||[]),b];for(let i=1;i<pts.length;i++)line(pts[i-1],pts[i],`CABLE_${c.type.replace(/[^a-zA-Z0-9_]/g,'_')}`)}}s+='0\nENDSEC\n0\nEOF\n';file(s,(doc.name||'room')+'.dxf','application/dxf');notify('DXF ساده خروجی گرفته شد؛ متادیتای پورت‌ها در آن حفظ نمی‌شود')}
function printNow(){const title=$('pdfTitle').checked,withReport=$('pdfReport').checked;let clone=svg.cloneNode(true);clone.setAttribute('width','960');clone.setAttribute('height','680');clone.setAttribute('viewBox','0 0 960 680');const html=`<!doctype html><html dir="rtl"><meta charset="utf-8"><title>${clean(doc.name)}</title><style>body{font-family:Tahoma,Arial;padding:20px;color:#192638}svg{max-width:100%;height:auto;background:#e8edf0}h2{font-size:20px}table{border-collapse:collapse;width:100%;font-size:11px}td,th{border:1px solid #aaa;padding:6px}@page{size:A4 landscape;margin:12mm}</style>${title?`<h2>${clean(doc.name)} <small>· ${clean(doc.date)}</small></h2>`:''}${clone.outerHTML}${withReport?`<h3>گزارش ارتباطات</h3>${reportHTML()}`:''}<p style="font-size:10px">Room Designer · Powered by NSP</p><script>window.onload=()=>setTimeout(()=>window.print(),450)<\/script></html>`;const b=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(b);const w=window.open(url,'_blank');if(!w){file(html,'room-print.html','text/html');notify('مرورگر پنجره چاپ را مسدود کرد؛ فایل چاپ دریافت شد')}close()}
$('overlay').onclick=close;$('closeSheet').onclick=close;$('menuBtn').onclick=menu;$('addBtn').onclick=addMenu;$('propsBtn').onclick=propertyMenu;$('selectTool').onclick=()=>setTool('select');$('cableBtn').onclick=()=>setTool('cable');$('panBtn').onclick=()=>setTool('pan');$('undoBtn').onclick=()=>{if(history.length){doc=JSON.parse(history.pop());selection=null;render();notify('بازگشت انجام شد')}};$('zoomBtn').onclick=()=>{view={x:0,y:0,w:960,h:680};render()};
$('sheetContent').addEventListener('click',e=>{const b=e.target.closest('[data-add],[data-act],[data-open],[data-group],[data-restore]');if(!b)return;if(b.dataset.restore){const rev=doc.revisions?.find(r=>r.number===Number(b.dataset.restore));if(!rev)return;if(!confirm('محتوای این Revision بازیابی شود؟ ذخیره نهایی یک Revision جدید خواهد ساخت.'))return;checkpoint();doc.devices=JSON.parse(JSON.stringify(rev.snapshot.devices));doc.cables=JSON.parse(JSON.stringify(rev.snapshot.cables));doc.name=rev.snapshot.name;doc.date=rev.snapshot.date;close();render();saveDialog();return}if(b.dataset.group){groupMenu(b.dataset.group);return}if(b.dataset.add!=null){addDevice(+b.dataset.add);return}if(b.dataset.open){doc=JSON.parse(JSON.stringify(profiles[b.dataset.open]));selection=null;history=[];close();render();return}const a=b.dataset.act;switch(a){case 'new':if(!confirm('نقشه جدید ایجاد شود؟ برای نگهداری نقشه فعلی، ابتدا آن را ذخیره کن.'))return;doc=fresh();history=[];selection=null;close();render();break;case 'saveLocal':saveDialog();break;case 'saveCopy':saveDialog(true);break;case 'commitSave':saveLocal(false);break;case 'commitCopy':saveLocal(true);break;case 'history':revisionMenu();break;case 'userSwitch':userPicker(true);break;case 'userCreate':activateUser(($('userNew').value||'').trim());break;case 'userSelect':activateUser($('userExisting').value);break;case 'projects':projectsMenu();break;case 'projectInfo':info();break;case 'saveInfo':checkpoint();doc.name=$('projName').value.trim()||'بدون نام';doc.date=$('projDate').value||doc.date;close();render();break;case 'backGroups':addMenu();break;case 'types':typesMenu();break;case 'createDevice':deviceEditor();break;case 'saveCatalog':{const name=$('newName').value.trim(),pn=$('newPortName').value.trim();if(!name||!pn){notify('نام تجهیز و پورت ضروری است');return}catalog.push({name,kind:'custom',ports:[{name:pn,type:$('newPortType').value,side:$('newSide').value}]});safeStorage.setItem('rd_catalog',JSON.stringify(catalog));close();notify('تجهیز در کتابخانه ذخیره شد');break}case 'saveType':{const id=$('typeId').value.trim().toLowerCase(),name=$('typeName').value.trim();if(!/^[a-z0-9_-]+$/.test(id)||!name){notify('شناسه انگلیسی و نام معتبر وارد کن');return}types[id]={name,color:$('typeColor').value};safeStorage.setItem('rd_types',JSON.stringify(types));typesMenu();notify('نوع ارتباط افزوده شد');break}case 'exportJson':file(JSON.stringify({doc,types,catalog},null,2),(doc.name||'room')+'.roomplan');close();break;case 'import':$('fileInput').click();break;case 'report':report();break;case 'print':printMenu();break;case 'doPrint':printNow();break;case 'dxf':downloadDXF();close();break;case 'saveDevice':{const d=device(selection?.id);if(!d)return;checkpoint();d.name=$('dName').value||d.name;d.w=Math.max(50,+$('dWidth').value||120);d.h=Math.max(35,+$('dHeight').value||65);for(const x of $('sheetContent').querySelectorAll('[data-port-side]')){const p=d.ports.find(p=>p.id===x.dataset.portSide);if(p)p.side=x.value}close();render();break}case 'saveCable':{let c=doc.cables.find(c=>c.id===selection?.id);if(!c)return;checkpoint();c.type=$('cType').value;c.reserve=$('cReserve').checked;close();render();break}case 'deleteSelected':checkpoint();if(selection?.kind==='device'){doc.devices=doc.devices.filter(d=>d.id!==selection.id);doc.cables=doc.cables.filter(c=>c.a.dev!==selection.id&&c.b.dev!==selection.id)}else doc.cables=doc.cables.filter(c=>c.id!==selection?.id);selection=null;close();render();break;}});
$('fileInput').addEventListener('change',async e=>{try{const t=await e.target.files[0].text(),x=JSON.parse(t),d=x.doc||x;if(!Array.isArray(d.devices)||!Array.isArray(d.cables))throw Error('ساختار نامعتبر');doc=d;if(x.types){types={...defaults,...x.types};safeStorage.setItem('rd_types',JSON.stringify(types))}if(x.catalog){catalog=x.catalog;safeStorage.setItem('rd_catalog',JSON.stringify(catalog))}history=[];selection=null;close();render();notify('نقشه باز شد')}catch(err){notify('خطا در بازکردن فایل: '+err.message)}e.target.value=''});
try{const last=JSON.parse(safeStorage.getItem('rd_last'));if(last&&Array.isArray(last.devices))doc=last}catch{}render();if(!activeUser)setTimeout(()=>userPicker(),100);
})();</script></body></html>
