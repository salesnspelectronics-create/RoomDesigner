function clipboardSelection(){

 const groupId=selection?.kind==='group'?selection.id:null;
 const dev=doc.devices.filter(x=>ids.devices.includes(x.id)||selection?.kind==='device'&&selection.id===x.id||groupId&&x.groupId===groupId);
 const walls=(doc.walls||[]).filter(x=>ids.walls.includes(x.shapeId||x.id)||selection?.kind==='wall'&&selection.id===(x.shapeId||x.id)||groupId&&x.groupId===groupId);
 const cables=doc.cables.filter(x=>ids.cables.includes(x.id)||selection?.kind==='cable'&&selection.id===x.id||groupId&&x.groupId===groupId);

function copyDrawing(){const data=clipboardSelection();if(!data.devices.length&&!data.walls.length&&!data.cables.length)return notify('آبجکتی برای کپی انتخاب نشده');drawingClipboard=JSON.parse(JSON.stringify(data));clipboardPasteCount=0;notify('انتخاب در کلیپ‌بورد داخلی نقشه کپی شد');return true}
function detachDoorsFromMissingWalls(){const ids=new Set((doc.walls||[]).map(w=>w.id));for(const d of doc.devices)if(d.kind==='door'&&d.attachedWallId&&!ids.has(d.attachedWallId))d.attachedWallId=null}
function lockedDeletionDependencies(data){
 const removedDevices=new Set(data.devices.map(x=>x.id)),removedWalls=new Set(data.walls.map(x=>x.id));
 const dependentCables=doc.cables.filter(c=>(removedDevices.has(c.a.dev)||removedDevices.has(c.b.dev))&&!data.cables.some(x=>x.id===c.id));
 const dependentDoors=doc.devices.filter(d=>d.kind==='door'&&!removedDevices.has(d.id)&&removedWalls.has(d.attachedWallId));
 return [...dependentCables,...dependentDoors].some(x=>x.locked||layerLocked(x))
}
function deleteDrawing(){const data=clipboardSelection();if(!data.devices.length&&!data.walls.length&&!data.cables.length)return; if([...data.devices,...data.walls,...data.cables].some(x=>layerLocked(x)||x.locked)||lockedDeletionDependencies(data))return notify('برای حذف، ابتدا قفل آبجکت یا لایه را باز کنید');if(!confirm('آبجکت‌های انتخاب‌شده حذف شوند؟'))return;const did=new Set(data.devices.map(x=>x.id)),wid=new Set(data.walls.map(x=>x.id)),cid=new Set(data.cables.map(x=>x.id));checkpoint();doc.devices=doc.devices.filter(x=>!did.has(x.id));doc.walls=(doc.walls||[]).filter(x=>!wid.has(x.id));doc.cables=doc.cables.filter(x=>!cid.has(x.id)&&!did.has(x.a.dev)&&!did.has(x.b.dev));detachDoorsFromMissingWalls();selection=null;multiSelection=null;scheduleSave();render();notify('انتخاب حذف شد')}
function cutDrawing(){const data=clipboardSelection();const cutDeviceIds=new Set(data.devices.map(d=>d.id)),cutCableIds=new Set(data.cables.map(c=>c.id)),cutWallIds=new Set(data.walls.map(w=>w.id));if(data.devices.some(d=>d.kind==='door'&&d.attachedWallId&&!cutWallIds.has(d.attachedWallId)))return notify('برای Cut در متصل، دیوار مربوط را نیز انتخاب کنید تا اتصال در Paste حفظ شود');if(doc.devices.some(d=>d.kind==='door'&&cutWallIds.has(d.attachedWallId)&&!cutDeviceIds.has(d.id)))return notify('برای Cut دیوار، درهای متصل به آن را نیز انتخاب کنید تا اتصال آن‌ها در Paste حفظ شود');if(doc.cables.some(c=>(cutDeviceIds.has(c.a.dev)||cutDeviceIds.has(c.b.dev))&&!cutCableIds.has(c.id)))return notify('برای Cut تجهیزات متصل به کابل، کابل‌های وابسته را نیز همراه دو سر آن‌ها انتخاب کنید');if(data.cables.some(c=>!cutDeviceIds.has(c.a.dev)||!cutDeviceIds.has(c.b.dev)))return notify('برای Cut کابل، تجهیزات هر دو سر را نیز انتخاب کنید؛ در غیر این صورت Paste کابل ممکن نیست');if([...data.devices,...data.walls,...data.cables].some(x=>layerLocked(x)||x.locked)||lockedDeletionDependencies(data))return notify('آبجکت یا لایه قفل‌شده را نمی‌توان Cut کرد');if(!copyDrawing())return;const did=new Set(data.devices.map(x=>x.id)),wid=new Set(data.walls.map(x=>x.id)),cid=new Set(data.cables.map(x=>x.id));checkpoint();doc.devices=doc.devices.filter(x=>!did.has(x.id));doc.walls=(doc.walls||[]).filter(x=>!wid.has(x.id));doc.cables=doc.cables.filter(x=>!cid.has(x.id)&&!did.has(x.a.dev)&&!did.has(x.b.dev));detachDoorsFromMissingWalls();selection=null;multiSelection=null;scheduleSave();render();notify('آبجکت‌های انتخابی برش داده شدند')}
function pasteDrawing(){if(!drawingClipboard)return notify('کلیپ‌بورد نقشه خالی است');
 ensureLayers();
 const src=drawingClipboard,layerMap=new Map(doc.layers.map(l=>[l.id,l]));
 const destinationLayer=o=>layerMap.get(objectLayer(o))||layerMap.get(doc.activeLayer)||doc.layers[0];
 if([...src.devices,...src.walls,...src.cables].some(o=>destinationLayer(o).locked))return notify('لایه مقصد قفل است؛ پیش از درج کپی، قفل لایه را باز کنید');
 const devIds=new Map(),portIds=new Map(),wallIds=new Map(),groupIds=new Map(),shift=30*(++clipboardPasteCount);
 const copiedDevices=src.devices.map(x=>{const d=structuredClone(x);d.layerId=destinationLayer(x).id;devIds.set(x.id,uid());d.id=devIds.get(x.id);d.x+=shift;d.y+=shift;d.locked=false;if(d.groupId){if(!groupIds.has(d.groupId))groupIds.set(d.groupId,uid());d.groupId=groupIds.get(d.groupId)}d.ports=(d.ports||[]).map(p=>{const n={...p,id:uid()};portIds.set(x.id+':'+p.id,n.id);return n});return d});
 const copiedWalls=src.walls.map(x=>{const w=structuredClone(x);w.layerId=destinationLayer(x).id;wallIds.set(x.id,uid());w.id=wallIds.get(x.id);if(w.shapeId){if(!wallIds.has(w.shapeId))wallIds.set(w.shapeId,uid());w.shapeId=wallIds.get(w.shapeId)}if(w.groupId){if(!groupIds.has(w.groupId))groupIds.set(w.groupId,uid());w.groupId=groupIds.get(w.groupId)}w.a.x+=shift;w.a.y+=shift;w.b.x+=shift;w.b.y+=shift;return w});
 for(const d of copiedDevices)if(d.attachedWallId)d.attachedWallId=wallIds.get(d.attachedWallId)||null;
 const copiedCables=src.cables.filter(c=>devIds.has(c.a.dev)&&devIds.has(c.b.dev)&&portIds.has(c.a.dev+':'+c.a.port)&&portIds.has(c.b.dev+':'+c.b.port)).map(x=>{const c=structuredClone(x);c.layerId=destinationLayer(x).id;c.id=uid();c.a={dev:devIds.get(x.a.dev),port:portIds.get(x.a.dev+':'+x.a.port)};c.b={dev:devIds.get(x.b.dev),port:portIds.get(x.b.dev+':'+x.b.port)};c.waypoints=(c.waypoints||[]).map(p=>({x:p.x+shift,y:p.y+shift}));if(c.groupId){if(!groupIds.has(c.groupId))groupIds.set(c.groupId,uid());c.groupId=groupIds.get(c.groupId)}return c});
 // A copied group is meaningful only if at least two distinct logical objects survive.
 const groupMembers=new Map();
 for(const d of copiedDevices)if(d.groupId){if(!groupMembers.has(d.groupId))groupMembers.set(d.groupId,new Set());groupMembers.get(d.groupId).add('device:'+d.id)}
 for(const w of copiedWalls)if(w.groupId){if(!groupMembers.has(w.groupId))groupMembers.set(w.groupId,new Set());groupMembers.get(w.groupId).add('wall:'+(w.shapeId||w.id))}
 for(const c of copiedCables)if(c.groupId){if(!groupMembers.has(c.groupId))groupMembers.set(c.groupId,new Set());groupMembers.get(c.groupId).add('cable:'+c.id)}
 for(const obj of [...copiedDevices,...copiedWalls,...copiedCables])if(obj.groupId&&(groupMembers.get(obj.groupId)?.size||0)<2)delete obj.groupId;
 if(!copiedDevices.length&&!copiedWalls.length&&!copiedCables.length)return notify('این انتخاب قابل Paste نیست؛ کابل باید همراه تجهیزات دو سر کپی شود');
 checkpoint();doc.devices.push(...copiedDevices);doc.walls.push(...copiedWalls);doc.cables.push(...copiedCables);const pastedIds={devices:copiedDevices.map(d=>d.id),walls:[...new Set(copiedWalls.map(w=>w.shapeId||w.id))],cables:copiedCables.map(c=>c.id)};const pastedCount=pastedIds.devices.length+pastedIds.walls.length+pastedIds.cables.length;multiSelection=pastedCount>1?pastedIds:null;selection=pastedCount===1?(pastedIds.devices.length?{kind:'device',id:pastedIds.devices[0]}:pastedIds.walls.length?{kind:'wall',id:pastedIds.walls[0]}:{kind:'cable',id:pastedIds.cables[0]}):null;resizeMode=false;scheduleSave();render();notify('کپی با شناسه‌های مستقل روی نقشه درج شد')
}

 const oldRotation=((Number(d.rotation)||0)%360+360)%360,newRotation=((oldRotation+Number(degrees||0))%360+360)%360;if(newRotation===oldRotation)return;checkpoint();d.rotation=newRotation;scheduleSave();render();

function ensureLayers(){
 if(!Array.isArray(doc.layers)||!doc.layers.length)doc.layers=[{id:'main',name:'لایه اصلی',visible:true}];

function layerVisible(obj){ensureLayers();return doc.layers.find(l=>l.id===objectLayer(obj))?.visible!==false&&obj.visible!==false}
function deviceVisibleOnCanvas(d){if(!d||!layerVisible(d))return false;if(d.kind==='door'&&d.attachedWallId){const wall=(doc.walls||[]).find(w=>w.id===d.attachedWallId);if(wall&&!layerVisible(wall))return false}return true}
function cableVisibleOnCanvas(c){return !!c&&layerVisible(c)&&deviceVisibleOnCanvas(device(c.a?.dev))&&deviceVisibleOnCanvas(device(c.b?.dev))}
function layerLocked(obj){ensureLayers();return doc.layers.find(l=>l.id===objectLayer(obj))?.locked===true}
function canCreateInActiveLayer(){ensureLayers();if(doc.layers.find(l=>l.id===doc.activeLayer)?.locked){notify('لایه فعال قفل است؛ برای افزودن تجهیز ابتدا قفل لایه را باز کنید');return false}return true}
function layerObjects(id){return [...doc.devices,...doc.cables,...(doc.walls||[])].filter(o=>objectLayer(o)===id)}
function layerObject(kind,id){return kind==='device'?device(id):kind==='cable'?doc.cables.find(c=>c.id===id):(doc.walls||[]).find(w=>(w.shapeId||w.id)===id)}
function selectLayerObject(kind,id,extend=false){
 const obj=layerObject(kind,id);if(!obj)return;
 setTool('select');ensureLayers();
 if(doc.layers.some(l=>l.id===objectLayer(obj)))doc.activeLayer=objectLayer(obj);
 if(extend){
  const next=multiSelection?{devices:[...multiSelection.devices],walls:[...multiSelection.walls],cables:[...multiSelection.cables]}:{devices:[],walls:[],cables:[]};
  // A selected group expands to real object IDs before toggling one member.
  if(selection?.kind==='group'){
   const members=allGroupElements(selection.id);
   for(const [key,ids] of [['devices',members.devices.map(d=>d.id)],['walls',members.walls.map(w=>w.shapeId||w.id)],['cables',members.cables.map(c=>c.id)]])next[key]=[...new Set([...next[key],...ids])];
  }else if(selection){const key=selection.kind==='device'?'devices':selection.kind==='wall'?'walls':'cables';if(!next[key].includes(selection.id))next[key].push(selection.id)}
  const key=kind==='device'?'devices':kind==='wall'?'walls':'cables';

}

document.addEventListener('click',e=>{const b=e.target.closest('[data-history-index]');if(!b)return;const index=Number(b.dataset.historyIndex);if(!Number.isInteger(index)||index<0||index>=history.length)return;if(!confirm('به وضعیت این مرحله برگردیم؟ وضعیت فعلی در Undo ذخیره خواهد شد.'))return;let restored;try{restored=validateRoomDocument(JSON.parse(history[index]))}catch(err){notify('بازگردانی نامعتبر است: '+err.message);return}checkpoint();doc=restored;selection=null;multiSelection=null;clearPointerState();scheduleSave();close();render();notify('نقشه به وضعیت انتخابی بازگشت')});
setupDesktopWorkspace();
if(equipmentMigrated)setTimeout(()=>showEquipmentMigrationNotice(),200);
window.__roomStartupReady=true;
loadPublishedSvgLibrary();
