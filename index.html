function pruneOrphanedGroups(removed){

 });

 ['ویرایش',[['undo','بازگشت','undo'],['redo','انجام مجدد','redo'],['selectAll','انتخاب همه','select'],['duplicateSelected','کپی انتخاب','layers'],['deleteSelected','حذف انتخاب','file'],['actionHistory','تاریخچه عملیات','history']]],
 ['پروژه',[['projects','نقشه‌های این دستگاه','file'],['projectInfo','مشخصات نقشه','settings'],['history','تاریخچه Revision','history'],['report','گزارش ارتباطات','file']]],
 ['تنظیمات',[['manageCustom','مدیریت / حذف تجهیزات سفارشی','settings'],['toolboxOrder','چیدمان منوها','settings'],['types','انواع ارتباطات','settings'],['snap','چسبندگی به گرید','settings'],['userSwitch','تغییر کاربر','custom'],['userLogout','خروج کاربر','custom'],['userRenamePanel','تغییر نام کاربر','custom']]],
 ['راهنما',[['help','راهنمای ابزارها','help'],['about','درباره و نسخه','help']]]];
 const nav=document.createElement('nav');nav.className='desktop-nav';nav.setAttribute('aria-label','منوی برنامه');
 nav.innerHTML=menus.map(([name,items])=>`<details><summary>${name}</summary><div class="desktop-menu">${items.map(([act,n,ic])=>`<button data-desk-command="${act}">${deskIcon(ic)}${n}${act==='new'?'<kbd>Ctrl+Alt+N</kbd>':act==='import'?'<kbd>Ctrl+O</kbd>':''}</button>`).join('')}</div></details>`).join('');
 document.querySelector('header').append(nav);const shortcuts=document.createElement('div');shortcuts.className='desktop-clipboard';shortcuts.innerHTML='<button data-desk-command="select" title="ابزار انتخاب" aria-label="ابزار انتخاب">↖ <small>Select</small></button><button data-clip="undo" title="Ctrl+Z">↶ <small>Ctrl+Z</small></button><button data-clip="cut" title="Ctrl+X">✂ <small>Ctrl+X</small></button><button data-clip="copy" title="Ctrl+C">▣ <small>Ctrl+C</small></button><button data-clip="paste" title="Ctrl+V">▤ <small>Ctrl+V</small></button><button data-clip="delete" title="Delete" aria-label="حذف انتخاب">🗑 <small>Delete</small></button><button data-clip="group" title="Ctrl+G · Group">⊞ <small>Group</small></button><button data-clip="ungroup" title="Ctrl+Shift+G · Ungroup">⊟ <small>Ungroup</small></button><button data-clip="smartPorts" title="مدیریت هوشمند پورت‌ها: مرتب‌سازی بر اساس مقصد کابل‌ها">⇅ <small>Smart Ports</small></button><button data-clip="rotateLeft" title="Rotate Left 90°" aria-label="Rotate Left 90°">⟲ <small>Rotate Left</small></button><button data-clip="rotateRight" title="Rotate Right 90°" aria-label="Rotate Right 90°">⟳ <small>Rotate Right</small></button>';document.querySelector('header').append(shortcuts);const date=document.createElement('span');date.className='desk-persian-date';date.textContent=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'}).format(new Date());const brand=document.querySelector('header .brand');brand.innerHTML='<span class="desk-brand-title">ROOM DESIGNER</span><small>Powered by NSP · V349 · '+new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())+'</small>';document.querySelector('header').append(date);/* Shared header controls replace the old desktop-only display buttons. */

 const head=(title,key,side)=>`<div class="desk-heading"><strong>${title}</strong><span class="desk-head-actions"><button data-desk-all="${side}" aria-label="جمع یا بازکردن بخش‌ها">${deskIcon('layers')}</button><button data-dock-pin="${key}" aria-label="پین ${title}" aria-pressed="true" title="پین / حالت شناور">${deskIcon('pin')}</button><button data-dock-close="${key}" aria-label="بستن ${title}" title="بستن پنل">×</button></span></div>`;
 $('deskLeft').innerHTML=head('جعبه ابزار','tools','left')+'<div class="desk-body"></div>';
 $('deskRight').innerHTML=head('لایه‌ها و گروه‌ها','layers','right')+'<div class="desk-body"><div id="deskExplorer"></div></div>';
 setupWorkspaceDock();
 const status=document.createElement('div');status.className='desktop-status';status.setAttribute('aria-label','وضعیت بوم');
 status.innerHTML=`<button id="deskZoomPercent" data-desk-command="resetZoom" title="بازگشت به ۱۰۰٪">100%</button><button data-desk-command="zoomIn" aria-label="بزرگ‌نمایی" title="بزرگ‌نمایی">${deskIcon('zoomIn')}</button><button data-desk-command="zoomOut" aria-label="کوچک‌نمایی" title="کوچک‌نمایی">${deskIcon('zoomOut')}</button><button id="deskPan" data-desk-command="pan" aria-label="حرکت بوم" title="حرکت بوم" aria-pressed="false">${deskIcon('pan')}</button><button data-desk-command="fit" aria-label="نمایش کل نقشه" title="نمایش کل نقشه">${deskIcon('fit')}</button><span class="status-divider"></span><button id="deskSnap" data-desk-command="snap" aria-pressed="true" title="چسبندگی به گرید ۲۰ واحد نقشه">${deskIcon('lock')}<span id="deskSnapText">چسبندگی: ۲۰</span></button><span class="status-spacer"></span><span id="deskCursor">X: — &nbsp; Y: —</span><span class="status-units" title="مقیاس واقعی کالیبره نشده است">واحد نقشه</span>`;
 document.body.append(status);
 svg.addEventListener('pointermove',e=>{if(!document.body.classList.contains('desktop-layout'))return;const p=point(e),origin=initialPaperOrigin();$('deskCursor').textContent=`X: ${Math.round(p.x-origin.x)}   Y: ${Math.round(p.y-origin.y)}`});
 svg.addEventListener('pointerleave',()=>{$('deskCursor').textContent='X: —   Y: —'});
 nav.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)nav.querySelectorAll('details').forEach(other=>{if(other!==d)other.open=false})}));
 document.addEventListener('pointerdown',e=>{if(!nav.contains(e.target))nav.querySelectorAll('details').forEach(d=>d.open=false)});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')nav.querySelectorAll('details').forEach(d=>d.open=false)});
 document.addEventListener('click',e=>{
  const cmd=e.target.closest('[data-desk-command]');if(cmd){nav.querySelectorAll('details').forEach(d=>d.open=false);const a=cmd.dataset.deskCommand;if(a==='toolboxOrder')editToolboxOrder();else if(a==='select')setTool('select');else if(a==='selectAll')selectAllObjects();else if(a==='group')groupAllSelected();else if(a==='ungroup')ungroupSelected();else if(a==='actionHistory')actionHistory();else deskCommand(a);return}
  const all=e.target.closest('[data-desk-all]');if(all){const pane=$(all.dataset.deskAll==='left'?'deskLeft':'deskRight'),details=[...pane.querySelectorAll('.desk-body details')],expand=details.some(d=>!d.open);details.forEach(d=>d.open=expand);return}
  const item=e.target.closest('[data-tree-kind]');if(item){selectLayerObject(item.dataset.treeKind,item.dataset.treeId,e.ctrlKey||e.metaKey||e.shiftKey);return}
  const act=e.target.closest('[data-tool-add],[data-desk-act],[data-desk-arch],[data-desk-cable],[data-desk-add],[data-desk-built],[data-desk-symbol],[data-desk-image]');if(!act)return;
  if(act.dataset.toolAdd){e.preventDefault();e.stopPropagation();deviceEditor(act.dataset.toolAdd);return}
  if(act.dataset.deskImage){addImageObject();return}
  if(act.dataset.deskAdd!=null){addDevice(Number(act.dataset.deskAdd));return}
  if(act.dataset.deskSymbol){addPlanSymbol(act.dataset.deskSymbol);return}
  if(act.dataset.deskBuilt){addBuiltArchitecture(act.dataset.deskBuilt);return}
  if(act.dataset.deskCable){cableMode='direct';setTool('cable');return}
  if(act.dataset.deskArch){addGeneralShape(act.dataset.deskArch);return}
  switch(act.dataset.deskAct){case 'select':setTool('select');break;case 'create':deviceEditor();break;case 'manageCustom':manageCustomToolbox();break;case 'properties':propertyMenu();break;case 'group':groupAllSelected();break;case 'ungroup':ungroupSelected();break;case 'finishPolyline':if(tool==='wall'&&archMode==='polyline')setTool('select');break}
 });
 // The existing sheet can add/import a catalog; refresh cards after that dispatcher finishes.
 populateDesktopToolbox();window.addEventListener('resize',setDesktopLayout);setDesktopLayout();
}
// Preserve the existing mobile search and individual history restore workflows.
document.addEventListener('input',e=>{if(e.target.id==='mobileToolSearch'){const q=e.target.value.trim().toLocaleLowerCase('fa');$('mobileToolList')?.querySelectorAll('button').forEach(b=>b.hidden=!!q&&!b.textContent.toLocaleLowerCase('fa').includes(q))}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-history-index]');if(!b)return;const index=Number(b.dataset.historyIndex);if(!Number.isInteger(index)||index<0||index>=history.length)return;if(!confirm('به وضعیت این مرحله برگردیم؟ وضعیت فعلی در Undo ذخیره خواهد شد.'))return;let restored;try{restored=validateRoomDocument(JSON.parse(history[index]))}catch(err){notify('بازگردانی نامعتبر است: '+err.message);return}checkpoint();doc=restored;selection=null;multiSelection=null;clearPointerState();scheduleSave();close();render();notify('نقشه به وضعیت انتخابی بازگشت')});
function migrateSvgReferenceStorage(){
 if(recoveryJournalPending())return;
 normalizeSvgReferences(doc);normalizeSvgReferences(catalog);normalizeSvgReferences(profiles);normalizeSvgReferences(roomShortcuts);
 for(const key of ['rd_last','rd_profiles','rd_shortcuts','rd_catalog']){
  if(key==='rd_last'&&rdLastBlocked)continue;
  const before=safeStorage.getItem(key);if(!before)continue;
  try{const value=JSON.parse(before);normalizeSvgReferences(value);const after=JSON.stringify(value);if(after!==before)safeStorage.setItem(key,after)}catch(error){console.warn('SVG reference migration deferred',key,error)}
 }
}
migrateSvgReferenceStorage();
setupDesktopWorkspace();
positionWorkspaceView(true);render();
window.__roomStartupReady=true;
loadPublishedSvgLibrary();

})();</script></body></html>
